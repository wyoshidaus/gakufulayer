name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated core-only environment
        run: |
          python -m venv .venv-core
          .venv-core/bin/python -m pip install -e .
      - name: Verify the core CLI and that AGPL renderer is not installed
        run: |
          .venv-core/bin/python -c "from importlib.util import find_spec; from gakufulayer.cli import main; assert find_spec('fitz') is None; assert callable(main)"
          .venv-core/bin/gakufulayer --help
          .venv-core/bin/gakufulayer render --help
          .venv-core/bin/gakufulayer audit-metadata --help
      - name: Record core dependency versions and license metadata
        run: |
          mkdir -p inventory
          .venv-core/bin/python scripts/dependency_inventory.py \
            --mode core --output inventory/core-py312.json \
            --notice-dir inventory/notice-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory-core-py312
          path: inventory/
          retention-days: 30
  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify release-package license and dependency metadata
        run: |
          python scripts/check_package_artifacts.py \
            --wheel "$(echo dist/*.whl)" \
            --sdist "$(echo dist/*.tar.gz)" \
            --source-license LICENSE \
            --report package-report.json
      - name: Install wheel without optional PDF dependencies
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -c "from importlib.util import find_spec; assert find_spec('fitz') is None"
          .venv-wheel/bin/gakufulayer --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-dry-run-py312
          path: |
            package-report.json
            dist/*
          retention-days: 30
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test font for right-to-left text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Install
        run: python -m pip install -e '.[pdf,dev]'
      - name: Test
        run: python -m pytest -q
      - name: Record full dependency versions and license metadata
        if: always()
        run: |
          mkdir -p inventory
          python scripts/dependency_inventory.py \
            --mode full \
            --output inventory/full-py${{ matrix.python-version }}.json \
            --notice-dir inventory/notice-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-inventory-full-py${{ matrix.python-version }}
          path: inventory/
          retention-days: 30
