name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated core-only environment
        run: |
          python -m venv .venv-core
          .venv-core/bin/python -m pip install -e .
      - name: Verify the core CLI and that AGPL renderer is not installed
        run: |
          .venv-core/bin/python -c "from importlib.util import find_spec; from gakufulayer.cli import main; assert find_spec('fitz') is None; assert callable(main)"
          .venv-core/bin/gakufulayer --help
          .venv-core/bin/gakufulayer render --help
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test font for right-to-left text
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: Install
        run: python -m pip install -e '.[pdf,dev]'
      - name: Test
        run: python -m pytest -q
